name: Auto Generate book.json

on:
  push:
    paths:
      - '**/generatejson'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find generatejson marker files
        id: find
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILES=$(find . -name generatejson -not -path './.git/*' | sed 's|^\./||' || true)
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            FILES=$(git diff --name-only --diff-filter=AM -z HEAD^ HEAD | tr '\0' '\n' | grep -E '(^|/)generatejson$' | grep -v '^$' || true)
          else
            FILES=$(git show --name-only --diff-filter=A --format= HEAD | grep -E '(^|/)generatejson$' | grep -v '^$' || true)
          fi
          {
            echo "FILES<<__EOF__"
            echo "$FILES"
            echo "__EOF__"
          } >> "$GITHUB_ENV"
          echo "Marker files:"
          echo "$FILES"

      - name: Generate book.json recursively
        if: env.FILES != ''
        run: |
          cat > /tmp/generate_book.py << 'PYEOF'
          # -*- coding: utf-8 -*-
          import json
          import os
          import re
          import sys

          AUDIO_EXTS = {".mp3", ".m4a", ".wav", ".flac", ".ogg", ".aac", ".wma", ".opus", ".ape", ".aiff", ".aif"}
          LRC_EXTS = {".lrc"}
          MEDIA_EXTS = AUDIO_EXTS | LRC_EXTS

          SKIP_DIRS = {".git", ".github", "node_modules", "__pycache__"}

          def collect_unit_files(folder):
              """只统计该目录下(不含子目录)的音频/歌词文件，按基名去重，音频优先。"""
              files = {}
              for entry in os.listdir(folder):
                  full = os.path.join(folder, entry)
                  if not os.path.isfile(full):
                      continue
                  base, ext = os.path.splitext(entry)
                  ext = ext.lower()
                  if ext in MEDIA_EXTS:
                      if base not in files or ext in AUDIO_EXTS:
                          files[base] = full
              return files

          def parse_unit(base_name):
              sort_key = float("inf")
              m = re.match(r"^\d+", base_name)
              if m:
                  sort_key = int(m.group(0))
              title = base_name
              for s in ("\uff0d", "-"):
                  if s in base_name:
                      title = base_name.split(s, 1)[1].strip()
                      break
              title = re.sub(r"[.\s]+$", "", title)
              return sort_key, title

          def generate_book(folder):
              name = os.path.basename(os.path.normpath(folder))
              files = collect_unit_files(folder)
              if not files:
                  return None
              units = []
              for base in sorted(files, key=lambda b: parse_unit(b)[0]):
                  _, title = parse_unit(base)
                  units.append({"title": title, "filename": base})
              return {"name": name, "level": "Unknow", "units": units}

          def existing_book_nonempty(out_path):
              """已存在且有实质内容（去掉空白字符后非空）才算非空。"""
              if not os.path.isfile(out_path):
                  return False
              try:
                  if os.path.getsize(out_path) == 0:
                      return False
                  with open(out_path, encoding="utf-8") as f:
                      return bool(f.read().strip())
              except Exception:
                  return False

          def walk_and_generate(root):
              generated, skipped_exists, skipped_empty = [], [], []
              for current, dirs, _files in os.walk(root):
                  dirs[:] = sorted(d for d in dirs if d not in SKIP_DIRS and not d.startswith("."))
                  if not collect_unit_files(current):
                      continue  # 该目录无媒体/字幕文件，不生成
                  out_path = os.path.join(current, "book.json")
                  rel = os.path.relpath(out_path, root)
                  if existing_book_nonempty(out_path):
                      skipped_exists.append(rel)
                      print(f"SKIP (book.json exists and non-empty): {rel}")
                      continue
                  book = generate_book(current)
                  if book is None:
                      skipped_empty.append(rel)
                      continue
                  with open(out_path, "w", encoding="utf-8") as f:
                      json.dump(book, f, ensure_ascii=False, indent=2)
                  generated.append(rel)
                  print(f"GENERATED: {rel} ({len(book['units'])} units)")
              return generated, skipped_exists, skipped_empty

          def main():
              targets = [line.strip() for line in sys.stdin if line.strip()]
              total_generated = 0
              for path in targets:
                  if not os.path.exists(path):
                      print(f"SKIP (not exists): {path}")
                      continue
                  folder = os.path.dirname(os.path.abspath(path))
                  print(f"=== Scan root: {folder} ===")
                  gen, skip_exist, _ = walk_and_generate(folder)
                  total_generated += len(gen)
                  print(f"--- root done: generated={len(gen)}, skipped(existing non-empty)={len(skip_exist)}")
              print(f"TOTAL generated: {total_generated}")

          main()
          PYEOF
          echo "$FILES" | python3 /tmp/generate_book.py

      - name: Remove generatejson markers
        if: env.FILES != ''
        run: |
          echo "$FILES" | while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ -f "$f" ]; then
              rm -f "$f"
              echo "REMOVED: $f"
            else
              echo "SKIP (marker not found): $f"
            fi
          done

      - name: Commit and push
        if: env.FILES != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: auto generate book.json and remove generatejson marker"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
